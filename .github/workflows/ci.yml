name: CI Pipeline

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

# Iska purpose: GitHub Actions ko permission dena ke woh GHCR mein Docker image push kar sake.

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    # -------------------------------------------------------------
    # Service Container: Start PostgreSQL (Empty DB)
    # -------------------------------------------------------------
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      # DB URLs pointing to the GitHub Actions Postgres Service
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      # JWT & App Secrets for Testing
      JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
      SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
      JWT_ALGORITHM: HS256
      ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      # 1. Checkout repository code
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install ruff mypy bandit pip-audit pytest pytest-cov

      # 4. Code formatting & linting (Ruff)
      - name: 4. Run Ruff (Linter & Formatter)
        run: |
          ruff check .
          ruff format --check .

      # 5. Static Type Checking (mypy)
      - name: 5. Run mypy (Type Checker)
        run: |
          mypy app --ignore-missing-imports --explicit-package-bases

      # 6. Security Static Analysis (Bandit)
      - name: 6. Run Bandit (Security Scan)
        run: |
          bandit -r app -ll

      # 7. Dependency Vulnerability Audit (pip-audit)
      - name: 7. Run pip-audit (Vulnerability Scan)
        run: |
          pip-audit

      # 8 & 9. Database Migrations on clean PostgreSQL
      - name: 8 & 9. Run Alembic Migrations on Empty Database
        run: |
          alembic upgrade head

      # 10. Run Unit Tests
      - name: 10. Run Unit Tests
        run: |
          pytest tests/test_*.py

      # 11. Run Integration Tests
      - name: 11. Run Integration Tests
        run: |
          pytest tests/integration/

      # 12. Run Test Coverage & Generate Report
      - name: 12. Run Coverage Report
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml tests/

      # 13. Build Docker Image with GHCR tags
      - name: 13. Build Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${REPO_LOWER}:${{ github.sha }}"
          IMAGE_LATEST="ghcr.io/${REPO_LOWER}:latest"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "IMAGE_LATEST=${IMAGE_LATEST}" >> $GITHUB_ENV
          docker build -t ${IMAGE_URI} -t ${IMAGE_LATEST} -t team-project-api:ci-test .

      # 14. Scan Docker Image with Trivy
      - name: 14. Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      # 15. Log in to GitHub Container Registry (GHCR)
      - name: 15. Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 16. Push Approved Docker Image to GHCR
      - name: 16. Push Approved Docker Image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_URI }}
          docker push ${{ env.IMAGE_LATEST }}

