name: CI Pipeline

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    # -------------------------------------------------------------
    # Service Container: Start PostgreSQL (Empty DB)
    # -------------------------------------------------------------
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      # DB URLs pointing to the GitHub Actions Postgres Service
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      # JWT & App Secrets for Testing
      SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      # 1. Checkout repository code
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies
      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pip-audit pytest pytest-cov

      # 4. Code formatting & linting (Ruff)
      - name: 4. Run Ruff (Linter & Formatter)
        run: |
          ruff check .
          ruff format --check .

      # 5. Static Type Checking (mypy)
      - name: 5. Run mypy (Type Checker)
        run: |
          mypy app --ignore-missing-imports

      # 6. Security Static Analysis (Bandit)
      - name: 6. Run Bandit (Security Scan)
        run: |
          bandit -r app -ll

      # 7. Dependency Vulnerability Audit (pip-audit)
      - name: 7. Run pip-audit (Vulnerability Scan)
        run: |
          pip-audit

      # 8 & 9. Database Migrations on clean PostgreSQL
      - name: 8 & 9. Run Alembic Migrations on Empty Database
        run: |
          alembic upgrade head

      # 10. Run Unit Tests
      - name: 10. Run Unit Tests
        run: |
          pytest tests/test_*.py

      # 11. Run Integration Tests
      - name: 11. Run Integration Tests
        run: |
          pytest tests/integration/

      # 12. Run Test Coverage & Generate Report
      - name: 12. Run Coverage Report
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml tests/

      # 13. Build Docker Image
      - name: 13. Build Docker Image
        run: |
          docker build -t team-project-api:ci-test .
